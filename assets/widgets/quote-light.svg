<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 650 84'
    style='background-color: #00000000;'
    width='650px' height='84px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Multiline -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='7200ms' fill="freeze"
                    values='m0,26 h0 ; m0,26 h0 ; m0,26 h650 ; m0,26 h650' keyTimes='0;0;0.58333333333333;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#176A4A' font-size='21'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Simplicity does not precede complexity,
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Multiline -->
                                <animate id='d1' attributeName='d' begin='0s;d1.end'
                    dur='14400ms' fill="freeze"
                    values='m0,52 h0 ; m0,52 h0 ; m0,52 h650 ; m0,52 h650' keyTimes='0;0.5;0.79166666666667;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#176A4A' font-size='21'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            but follows it.
        </textPath>
    </text>
</svg>
